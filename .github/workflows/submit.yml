name: Submit Extension to Web Store

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read extension version
        id: check
        shell: bash
        run: |
          VERSION=$(node -p "require('./apps/extension/package.json').version" 2>/dev/null)
          if [ -z "$VERSION" ]; then
            echo "::error::Could not read apps/extension/package.json version"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  submit:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build + package extension
        run: |
          pnpm --filter extension build
          pnpm --filter extension package

      - name: Browser Platform Publish
        uses: PlasmoHQ/bpp@v3
        with:
          keys: ${{ secrets.SUBMIT_KEYS }}
          artifact: apps/extension/build/chrome-mv3-prod.zip
          verbose: true