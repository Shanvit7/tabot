name: Submit Extension to Web Store

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read extension version
        id: check
        shell: bash
        run: |
          VERSION=$(node -p "require('./apps/extension/package.json').version" 2>/dev/null)
          if [ -z "$VERSION" ]; then
            echo "::error::Could not read apps/extension/package.json version"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  submit:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build + package extension
        run: |
          pnpm --filter extension build
          pnpm --filter extension package
        env:
          PLASMO_PUBLIC_POSTHOG_ENABLED: 'true'
          PLASMO_PUBLIC_POSTHOG_KEY: ${{ vars.POSTHOG_PROJECT_KEY }}
          PLASMO_PUBLIC_POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
          PLASMO_PUBLIC_POSTHOG_RELEASE: ${{ github.sha }}

      - name: Save extension ZIP for manual review
        uses: actions/upload-artifact@v4
        with:
          name: tabot-extension-${{ needs.check.outputs.version }}
          path: apps/extension/build/chrome-mv3-prod.zip
          if-no-files-found: error
          retention-days: 30

      - name: Enforce Chrome draft-only upload
        id: draft
        env:
          SUBMIT_KEYS: ${{ secrets.SUBMIT_KEYS }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          import { chromeDraftKeys } from './scripts/chrome-draft-keys.mjs';
          const keys = chromeDraftKeys(process.env.SUBMIT_KEYS);
          console.log(`::add-mask::${keys}`);
          appendFileSync(process.env.GITHUB_OUTPUT, `keys=${keys}\n`);
          NODE

      - name: Upload Chrome Web Store draft — do not publish
        uses: PlasmoHQ/bpp@v3
        with:
          keys: ${{ steps.draft.outputs.keys }}
          artifact: apps/extension/build/chrome-mv3-prod.zip