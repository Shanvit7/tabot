name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and format check
        run: pnpm lint

      - name: Run behavioral checks
        run: pnpm test

      - name: Dry-run MCP deployment
        run: pnpm --filter mcp-server exec wrangler deploy --config wrangler.toml --dry-run

      - name: Build dashboard
        run: pnpm --filter web build

      - name: Build extension
        run: pnpm --filter extension build
