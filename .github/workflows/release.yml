name: Release — Version Packages

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Opens / updates the "Version Packages" PR. When it's merged, changesets
      # runs the publish script: we tag v<version> and dispatch the store submit
      # workflow. Single release path — only this hook can trigger submit.yml.
      - name: Create / update versioning PR
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm release:tag
          commit: "chore: version packages"
          title: "chore: version packages"
